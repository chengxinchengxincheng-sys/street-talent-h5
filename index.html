  e.dataset.pefired=1;
  run(pe,host);
}
function changeEl(p){
  var name=p.element_name, val=p.element_value;
  if(name==='point'){
    if(p.element_type==='delta') VARS.point+=parseFloat(val)||0;
    else VARS.point=parseFloat(val)||0;
    log('point='+VARS.point); return;
  }
  pq(name).forEach(function(e){
    if(p.element_property==='background'){
      if(e.classList.contains('txt')) e.style.color=val;   // 文字元素：选中态文字变红
      else e.style.background=val;
    }
    else if(p.element_property==='alpha') e.style.opacity=(parseFloat(val)||0)/100;
    else if(p.element_property==='left') e.style.left=val+'px';   // 瞬时原地出现，无滑动
    else if(p.element_property==='text') e.textContent=val;
  });
}
/* 启动元素动画（CSS 或打字机），结束后触发 preset_end */
function startAnim(e){
  var done=0;
  if(e.dataset.anim){
    var a=e.dataset.anim;
    e.style.animation='none'; void e.offsetWidth; e.style.animation=a;
    e.addEventListener('animationend',function(){ firePresetEnd(e); });
    done=1;
  }
  if(e.dataset.typer!==undefined){
    var tp2=(e.dataset.typer||'0.5|0').split('|');
    var dur2=parseFloat(tp2[0])||0.5, del2=parseFloat(tp2[1])||0;
    if(e.classList.contains('shape')){
      // shape 的打字机 = 横向扫出（way=progress），播完再触发 preset_end
      setTimeout(function(){
        e.style.transition='clip-path '+dur2+'s linear';
        e.style.clipPath='inset(0 0% 0 0)';
        setTimeout(function(){ firePresetEnd(e); }, dur2*1000+30);
      }, del2*1000);
    } else {
      typewriter(e,function(){ firePresetEnd(e); });
    }
    done=1;
  }
  return done;
}
/* play：显示并播放目标元素；无动画的元素（如 P1-P4 选中标记）延迟触发 preset_end */
function playScope(scope){
  if(!scope) return;
  pq(scope).forEach(function(e){
    e.style.opacity=1;
    if(e.dataset.played) return;
    e.dataset.played=1;
    if(!startAnim(e)){
      setTimeout(function(){ firePresetEnd(e); }, 1000);   // 无动画：停留 1s 让选中态可见，再翻页
    }
  });
}

/* ---------- 翻页 ---------- */
function resetPage(n){
  var p=(typeof n==='number')?document.getElementById('p'+n):n; if(!p) return;
  p.querySelectorAll('[data-s0]').forEach(function(e){
    e.setAttribute('style', e.dataset.s0);
    delete e.dataset.played; delete e.dataset.pefired; delete e.dataset.done;
    e.style.animation='none';
    if(e.dataset.typer!==undefined) e.innerHTML='';       // 打字机回到空白
  });
}
/* 图片按需加载：非首屏页的 img 只带 data-src，进入该页时才真正下载 */
var PAGE_IMGS={"0": ["images/69de4bb7c63aa94ff702af87.webp", "images/69de4c9e831ab7d5bc0683e6.webp", "images/69de4c9e984a36850f08c995.webp", "images/69de4c9edeed7c7f830b1d86.webp", "images/69de4c9efdf3a5881e0f0cbf.webp", "images/69de4e69582fcb150c063506.webp", "images/69de4f68b53fb422d90fc93e.webp", "images/69de4fa2c70818bbfa0967e1.webp", "images/69de4fa3f18679a4040e886f.webp"], "1": ["images/69de50f6699b4a3fd2016d0b.webp", "images/69de5681a4d78527520c7d17.webp", "images/69df476f4af1a00d2b067d59.webp", "images/69df476fadbc2708820378a8.webp"], "2": ["images/69def5ed8b4c24292b00875d.webp", "images/69def8b58e6011c5830f8792.webp", "images/69ea131e1f1368e8b101ac57.webp", "images/69ea1347809eb8b7cc040a05.webp"], "3": ["images/69df007881d847533a0f26df.webp", "images/69df0078c99ae2b8ee015775.webp", "images/69df44f6c864b40b0c0eda79.webp", "images/69df46e7e4485f69270373b1.webp"], "4": ["images/69df4867db53e505790bbb75.webp", "images/69df4887ae1ab329e4002005.webp", "images/69df4887e9a115cf9a016fee.webp", "images/69df8925a956d7a03700a627.webp", "images/69ea1355c8ebc4db960e831d.webp"], "5": ["images/69df80f0fc4ee1e57c059f9c.webp", "images/69df89288488d8c83705e35a.webp", "images/69e784990b004618d10ca392.gif"], "7": ["images/69df4ad6d4f473c300006e33.webp", "images/69e79832d927e70837049481.webp", "images/69e7986775b0089e7105ea2f.webp", "images/69e79867af680c318a0b09c3.webp", "images/69fc966b916dd351e601e21e.webp"], "8": ["images/69df4ad6d4f473c300006e33.webp", "images/69e7986775b0089e7105ea2f.webp", "images/69e79b374bf2dc112e091c30.webp", "images/69e79b49f9f623898a0c08cb.webp", "images/69fc966cb214a41c4b01422e.webp"], "9": ["images/69df4ad6d4f473c300006e33.webp", "images/69e7986775b0089e7105ea2f.webp", "images/69e79b3f6755f0c9bc053873.webp", "images/69e79b4afed5012d4f035291.webp", "images/69fc966d83da20d0d2042cc3.webp"], "10": ["images/69df4ad6d4f473c300006e33.webp", "images/69e7986775b0089e7105ea2f.webp", "images/69e79b4857db4a7f6f0e07a4.webp", "images/69e79b488a55c447b30db9c2.webp", "images/69fc966ea46fae426d002126.webp"]};
var LOADED={};
function hydrate(p){
  p.querySelectorAll('img[data-src]').forEach(function(im){
    var s=im.getAttribute('data-src'); if(!s) return;
    im.removeAttribute('data-src'); im.src=s;
  });
}
function prefetch(n){                                  // 预载指定页图片（后台，不阻塞）
  var list=PAGE_IMGS[n]; if(!list||LOADED[n]) return; LOADED[n]=1;
  list.forEach(function(s){ var im=new Image(); im.src=s; });
}
var TRANS_MS=600, ease='cubic-bezier(.45,.05,.55,.95)', transitioning=false;
function go(n,dir){
  if(n==null||n<0||n>=11) return;
  if(n===cur){ startPage(cur); return; }
  if(transitioning) return;
  transitioning=true;
  var d=(dir===undefined)?(n>cur?1:-1):dir;               // 前进：新页从下推入；后退：从上
  var oldIdx=cur, old=document.getElementById('p'+oldIdx);
  var nw=document.getElementById('p'+n);
  if(old){
    old.classList.add('on');
    old.style.transition='transform '+TRANS_MS+'ms '+ease;
    old.style.transform='translateY('+(d>0?-100:100)+'%)';
  }
  nw.style.transition='none';
  nw.style.transform='translateY('+(d>0?100:-100)+'%)';
  nw.classList.add('on');
  void nw.offsetWidth;                                     // reflow：让起点生效
  nw.style.transition='transform '+TRANS_MS+'ms '+ease;
  nw.style.transform='translateY(0)';
  resetPage(nw);
  hydrate(nw);                                           // 目标页图片立即开始下载
  cur=n;
  prefetch(n+1); prefetch(n+2);                          // 顺带预载后续两页
  // 入场动画等转场结束再播，避免答题卡/结果卡在滑动过程中提前出现
  setTimeout(function(){ startPage(nw); }, TRANS_MS);
  setTimeout(function(){
    if(old){ old.classList.remove('on'); old.style.transition='none'; resetPage(oldIdx); }
    transitioning=false;
  }, TRANS_MS+40);
  log('page '+cur+' point='+VARS.point);
}
/* 启动某页入场动画（play 目标除外）与 appear 行为 */
function startPage(n){
  var p=(typeof n==='number')?document.getElementById('p'+n):n; if(!p) return;
  hydrate(p);
  p.querySelectorAll('[data-anim],[data-typer]').forEach(function(e){
    var nm=e.dataset.nm||'';
    if(PLAY_TARGETS.indexOf(nm)>=0) return;
    startAnim(e);
  });
  p.querySelectorAll('[data-beh]').forEach(function(el){
    var b=parseBeh(el); if(!b) return;
    b.filter(function(x){return x.event==='appear';}).forEach(function(x){ run([x],el); });
  });
}

/* ---------- 绑定 ---------- */
document.querySelectorAll('[data-beh]').forEach(function(node){
  var b=parseBeh(node); if(!b) return;
  var nm=node.dataset.nm||'';
  var mt=nm.match(/^([abc])([1-5])$/);
  if(mt) node.dataset.quiz=mt[2];
  if(b.some(function(x){return x.event==='click';})){
    node.classList.add('hotwrap');
    if(node.classList.contains('layer')) node.querySelectorAll('.el').forEach(function(e){e.classList.add('hot');});
    else node.classList.add('hot');
  }
});
document.addEventListener('click',function(e){
  var n=e.target.closest && e.target.closest('[data-beh]');
  if(!n) return;
  var b=parseBeh(n); if(!b) return;
  var click=b.filter(function(x){return x.event==='click';});
  if(!click.length) return;
  if(n.dataset.done) return;
  n.dataset.done=1;
  run(click,n);
  // 兜底：题目页点击 6s 后仍停留则强制翻页（正常情况下动画结束会自动跳）
  if(n.dataset && n.dataset.quiz){
    var from=cur, qn=+n.dataset.quiz;
    setTimeout(function(){
      if(cur!==from) return;
      if(qn<5) go(cur+1);
      else { // 第5题：按分值兜底跳结果页
        var t=VARS.point;
        go(t<=7?7:(t<=9?8:(t<=11?9:10)));
      }
    }, 6000);
  }
});

/* ---------- 开场加载：真实预载进度，结束后进入首页并默认播放 BGM ---------- */
var loader=document.getElementById('loader'), lfill=document.getElementById('lfill'), lpct=document.getElementById('lpct');
var total=PRELOAD.length||1, done=0, pct=0, finished=false, T0=Date.now();
function setPct(p){ pct=p; lfill.style.transform='translateX('+(p*2.52)+'px)'; lpct.textContent=p+'%'; }
function finish(){
  if(finished) return; finished=true; clearInterval(smoother);
  setPct(100);
  setTimeout(function(){   // 至少显示 1s，避免局域网/缓存命中时一闪而过
    _enter();
  }, Math.max(0, 600-(Date.now()-T0)));
}
function _enter(){
  // 原版 loadRemovalDelay=0：加载完成直接移除加载层，P0 从纯背景色开始播入场动画
  loader.parentNode.removeChild(loader);
  startPage(0);
  prefetch(1); prefetch(2);                      // 后台预载后续页
  setTimeout(function(){ prefetchRest(); }, 1500);   // 首屏动画播完后再续载其余页
  warm();                                        // 尝试预热音效（失败则由首次触摸兜底）
  // BGM 10MB 延后 1.2s 启动，避免与首屏图片抢带宽
  setTimeout(function(){
    bgm.play().then(function(){ document.getElementById('bgmbtn').classList.add('on'); warm(); }).catch(function(){});
  }, 1200);
}
function prefetchRest(){                        // 低频续载剩余页面图片
  var keys=Object.keys(PAGE_IMGS).sort(function(a,b){return a-b;});
  var i=0;
  (function step(){ if(i>=keys.length) return; prefetch(+keys[i]); i++; setTimeout(step, 260); })();
}
var smoother=setInterval(function(){               // 进度平滑推进
  var real=Math.round(done/total*100);
  if(pct<real) setPct(Math.min(real, pct+Math.max(1, Math.round((real-pct)/5))));
}, 70);
PRELOAD.forEach(function(src){
  var im=new Image();
  im.onload=im.onerror=function(){ done++; if(done>=total) setTimeout(finish, 500); };
  im.src=src;
});
setTimeout(finish, 12000);                         // 兜底：最多等 12s

/* ---------- 适配 ---------- */
function fit(){
  var sw=window.innerWidth/W, sh=window.innerHeight/H, s=sw;   // width2：宽度撑满
  if(sw*H>window.innerHeight && sw/sh>1.12) s=sh;              // 极端比例才退化，避免裁掉主体
  document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';
}
fit(); window.addEventListener('resize',fit); window.addEventListener('orientationchange',fit);
document.getElementById('p0').classList.add('on');   // 首页作为加载背景，动画等加载结束再播
